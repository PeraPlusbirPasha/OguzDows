<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">OğuzDows 2.0 · Akıncı</title>
  <desc id="description">OğuzDows 2.0 Akıncı: PC ve Raspberry Pi için Türkçe masaüstü, telefon için ayrı native launcher. Ay yıldız ve Anadolu kilim motifleri. Köklerinden güç alır. Özgürce üretir.</desc>
