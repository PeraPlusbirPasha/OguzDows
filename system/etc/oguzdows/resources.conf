# PC / ARM ortak kaynak profili; shell betiği değildir.
# auto: <=768 MiB mini; <=2 GiB light; üzeri full (efektler yine isteğe bağlı).
# Özellik / paket kaldırılmaz, overclock ve tarayıcı güvenlik değişikliği yoktur.
# Pi'de pi.conf içindeki profil, ardından oguzdows.profile= çekirdek seçeneği önceliklidir.
profile=auto
