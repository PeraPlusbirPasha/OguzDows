# OğuzDows Aero: yalnızca açık tercihle + >2 GiB / uygun DRM / full profilde.
# Bookworm Picom 9 ve yeni sürümlerin ortak XRender yolu; GLX/blur/shader yok.
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = false;

# Açma / kapama ve simge durumuna geçme: yaklaşık 90–120 ms, sonsuz döngü yok.
fading = true;
fade-in-step = 0.10;
fade-out-step = 0.12;
fade-delta = 10;
no-fading-openclose = false;
fade-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "name *= 'Rıfkı'"
];

# Yazı / içerik / kapatma ve üst panel daima opak; inaktif pencere solmaz.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.0;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.16;
shadow-offset-x = -5;
shadow-offset-y = -3;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c",
  "name *= 'Rıfkı'"
];
# CSD'nin kendi yuvarlak köşesi korunur; eski Picom'da deneysel arka uç istenmez.
# Gala'nın spring / zoom / workspace animasyonları veya gerçek blur iddiası yok.

# Single corner owner: SSD outer frame only; GTK CSD and docks own their alpha.
corner-radius = 10;
rounded-corners-exclude = ["window_type = 'desktop'", "window_type = 'dock'", "fullscreen", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'", "_GTK_FRAME_EXTENTS@:c"];
