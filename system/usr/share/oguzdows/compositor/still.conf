# Yalnız açık kullanıcı onayı + full/>2GiB + gerçek hızlandırılmış GLX raporu.
# Sabit sistem reçetesi; kişisel picom.conf / üçüncü taraf script yüklenmez.
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.16;
shadow-offset-x = -5;
shadow-offset-y = -3;
shadow-exclude = ["window_type = 'desktop'", "window_type = 'dock'", "_GTK_FRAME_EXTENTS@:c", "name *= 'Rıfkı'"];
# ARGB dekorasyon şeritleri ve panel arka planı bulanır. İçerik opak kalır.
blur-background = false;

fading = false;

# Single corner owner: SSD outer frame only; GTK CSD and docks own their alpha.
corner-radius = 10;
rounded-corners-exclude = ["window_type = 'desktop'", "window_type = 'dock'", "fullscreen", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'", "_GTK_FRAME_EXTENTS@:c"];
