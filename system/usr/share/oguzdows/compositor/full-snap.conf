# Yalnız açık kullanıcı onayı + full/>2GiB + gerçek hızlandırılmış GLX raporu.
# Sabit sistem reçetesi; kişisel picom.conf / üçüncü taraf script yüklenmez.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;
frame-opacity = 1.0;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.16;
shadow-offset-x = -5;
shadow-offset-y = -3;
# ARGB dekorasyon şeritleri ve panel arka planı bulanır. İçerik opak kalır.
blur-method = "dual_kawase";
blur-strength = 2;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

fading = false;

# Picom 12+ API; masaüstü/panel, kurucu ve Rıfkı geometri animasyonu almaz.
rules = (
# Picom 12 ignores legacy *-exclude lists whenever rules is present.
{ match = "window_type != 'normal' || bounding_shaped || override_redirect || fullscreen || _GTK_FRAME_EXTENTS@:c || _NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT' || _NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_HORZ'"; corner-radius = 0; },
{ match = "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT' || _NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_HORZ'"; shadow = false; blur-background = false; },
{ match = "window_type != 'normal' && window_type != 'dock'"; blur-background = false; },
{ match = "window_type = 'desktop'"; shadow = false; blur-background = false; fade = false; },
{ match = "window_type = 'dock'"; shadow = false; fade = false; },
{ match = "_GTK_FRAME_EXTENTS@:c"; shadow = false; },
{ match = "name *= 'Rıfkı'"; shadow = false; blur-background = false; fade = false; },
{ match = "fullscreen"; shadow = false; blur-background = false; },
{ match = "window_type = 'normal' && !override_redirect && !fullscreen && name != 'OğuzDows Kurulum' && !(name *= 'Rıfkı')"; animations = ({
  triggers = [ "open", "show" ];
  user-time = { duration = 0.24; start = 0; end = 1; curve = "linear"; };
  user-response = "(1 - (1 + 9 * user-time) * (2.718281828 ^ (0 - 9 * user-time))) / 0.998765902";
  scale-x = "0.94 + 0.06 * user-response";
  scale-y = "scale-x";
  offset-x = "(1 - scale-x) * window-width / 2";
  offset-y = "(1 - scale-y) * window-height / 2";
  shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
  shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  opacity = "user-response";
},
{
  triggers = [ "close", "hide" ];
  user-time = { duration = 0.18; start = 0; end = 1; curve = "linear"; };
  user-response = "(1 - (1 + 9 * user-time) * (2.718281828 ^ (0 - 9 * user-time))) / 0.998765902";
  scale-x = "1 - 0.06 * user-response"; scale-y = "scale-x";
  offset-x = "(1 - scale-x) * window-width / 2";
  offset-y = "24 * user-response";
  shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
  shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  opacity = "1 - user-response";
},
{
  # DENEYSEL / ayrı onay: geometri tetikleyicisi sürüklemede de çalışır.
  triggers = [ "geometry" ];
  user-time = { duration = 0.20; start = 0; end = 1; curve = "linear"; };
  user-response = "(1 - (1 + 9 * user-time) * (2.718281828 ^ (0 - 9 * user-time))) / 0.998765902";
  user-x = { duration = 0.20; start = "window-x-before - window-x"; end = "window-x-before - window-x"; };
  user-y = { duration = 0.20; start = "window-y-before - window-y"; end = "window-y-before - window-y"; };
  user-w = { duration = 0.20; start = "window-width-before / window-width"; end = "window-width-before / window-width"; };
  user-h = { duration = 0.20; start = "window-height-before / window-height"; end = "window-height-before / window-height"; };
  offset-x = "user-x * (1 - user-response)"; offset-y = "user-y * (1 - user-response)";
  scale-x = "user-w + (1 - user-w) * user-response";
  scale-y = "user-h + (1 - user-h) * user-response";
  shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
  shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  saved-image-blend = "1 - user-response";
}); });
window-shader-fg = "/usr/share/oguzdows/compositor/glass.glsl";

# Do not clip shaped Xfwm frames, popups, menus, dialogs or client-owned CSD.
# One geometry owner prevents missing corners / menu borders during resize.
corner-radius = 10;
