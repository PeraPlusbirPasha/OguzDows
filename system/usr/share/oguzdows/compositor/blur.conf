# Yalnız açık kullanıcı onayı + full/>2GiB + gerçek hızlandırılmış GLX raporu.
# Sabit sistem reçetesi; kişisel picom.conf / üçüncü taraf script yüklenmez.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.16;
shadow-offset-x = -5;
shadow-offset-y = -3;
shadow-exclude = ["fullscreen", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_HORZ'", "window_type = 'desktop'", "window_type = 'dock'", "_GTK_FRAME_EXTENTS@:c", "name *= 'Rıfkı'"];
# ARGB dekorasyon şeritleri ve panel arka planı bulanır. İçerik opak kalır.
blur-method = "dual_kawase";
blur-strength = 2;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = ["window_type != 'normal' && window_type != 'dock'", "fullscreen", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_HORZ'", "window_type = 'desktop'", "name *= 'Rıfkı'"];

fading = true;
fade-in-step = 0.12;
fade-out-step = 0.15;
fade-delta = 10;
fade-exclude = ["window_type = 'dock'", "window_type = 'desktop'"];

# Do not clip shaped Xfwm frames, popups, menus, dialogs or client-owned CSD.
# One geometry owner prevents missing corners / menu borders during resize.
corner-radius = 10;
rounded-corners-exclude = ["window_type != 'normal'", "bounding_shaped", "override_redirect", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_HORZ'", "window_type = 'desktop'", "window_type = 'dock'", "fullscreen", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'", "_GTK_FRAME_EXTENTS@:c"];
