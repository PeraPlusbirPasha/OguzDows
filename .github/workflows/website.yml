name: OğuzDows · ücretsiz web sitesi

on:
  push:
    branches: [main, arena/2d796713-o-uzdows]
    paths:
      - "website/**"
      - "docs/releases/v2.0-arm1-release.json"
      - "docs/index.html"
      - "docs/404.html"
      - "docs/indir/**"
      - "docs/pc/**"
      - "docs/raspberry-pi/**"
      - "docs/telefon/**"
      - "docs/oguzkopru/**"
      - "docs/sss/**"
      - "docs/web/**"
      - "docs/assets/**"
      - "docs/robots.txt"
      - "docs/sitemap.xml"
      - "docs/.nojekyll"
      - "README.md"
      - "tests/test_website.py"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/releases/v2.0-arm1-release.json"
      - "docs/index.html"
      - "docs/404.html"
      - "docs/indir/**"
      - "docs/pc/**"
      - "docs/raspberry-pi/**"
      - "docs/telefon/**"
      - "docs/oguzkopru/**"
      - "docs/sss/**"
      - "docs/web/**"
      - "docs/assets/**"
      - "docs/robots.txt"
      - "docs/sitemap.xml"
      - "docs/.nojekyll"
      - "README.md"
      - "tests/test_website.py"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: oguzdows-website-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Statik HTML / SEO / Chromium / erişilebilirlik
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Küçük test bağımlılığı (site derlemesi Python stdlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil python3-yaml
      - name: Tekrarlanabilir statik çıktı / gerçek yayın linkleri / SEO kontratları
        run: |
          python3 website/build.py --check
          /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_website.py' -v
          /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_readme.py' -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/preview/package-lock.json
      - name: Mevcut kilitli tarayıcı araçları (APK / mobil UI derlenmez)
        run: npm ci --ignore-scripts --prefix mobile/preview
      - name: Gerçek Chromium · 7 sayfa / 4 genişlik / axe / JavaScript kapalı
        run: |
          python3 website/serve.py --host 0.0.0.0 --port 4176 > /tmp/oguzdows-website-test.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          WEBSITE_BASE_URL=http://127.0.0.1:4176/OguzDows/ node --test website/tests/browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: oguzdows-website-diagnostics
          path: .cache/website/
          retention-days: 7
          if-no-files-found: ignore

  pages-source:
    name: Onaylı main / docs Pages kaynağını eşleştir
    needs: check
    # Never grant Pages settings access to a pull request or an unmerged branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'PeraPlusbirPasha/OguzDows'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pages: write
    steps:
      - name: Yalnız kaynak ayarı / ücretsiz Pages derleme isteği
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          source=$(gh api "$endpoint" --jq '.source.branch + ":" + .source.path')
          if [ "$source" != "main:/docs" ]; then
            gh api --method PUT "$endpoint" --input - <<'JSON'
          {"source":{"branch":"main","path":"/docs"}}
          JSON
            gh api --method POST "$endpoint/builds" --jq '{status, commit, url}'
          fi
          source=$(gh api "$endpoint" --jq '.source.branch + ":" + .source.path')
          test "$source" = "main:/docs"
          gh api "$endpoint" --jq '{source, build_type, html_url, https_enforced, status}'
          echo '::notice title=Pages kaynağı doğrulandı::main:/docs; canlı deployment commit’i ayrıca doğrulanmalıdır.'
