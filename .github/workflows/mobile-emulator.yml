name: OğuzDows Mobile · APK ve emülatör

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-emulator.yml']

permissions:
  contents: read

concurrency:
  group: oguzdows-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: SDK 35 · Java 17 kaynakları · gerçek APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/preview/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Paketlenmiş arayüz · birim testleri · bağımlılık denetimi
        working-directory: mobile/preview
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: SDK ve APK · lint · Java testleri
        working-directory: mobile/android
        run: |
          python3 ../scripts/ci-command.py -- "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          python3 ../scripts/ci-command.py -- ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          mkdir -p ../../test-results/mobile
          cp app/build/outputs/apk/debug/app-debug.apk ../../test-results/mobile/OguzDows-Mobile-0.2.0-emulator-debug.apk
          cd ../../test-results/mobile
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oguzdows-mobile-apk-${{ github.run_id }}
          path: |
            test-results/mobile/
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: error
          retention-days: 14
