name: OğuzDows ISO

on:
  workflow_dispatch:
    inputs:
      target:
        description: PC ISO, test/kanıt, release taslağı veya Raspberry Pi imajları
        type: choice
        options: [pc, pc-tests, pc-diagnostics, pc-release, raspberrypi]
        default: pc
      evidence_run:
        description: pc-diagnostics için tamamlanmış; pc-release için başarılı PC çalışması
        type: string
        default: ""
      pi_evidence_run:
        description: pc-release için isteğe bağlı, aynı kaynaklı başarılı Pi armhf+arm64 çalışması
        type: string
        default: ""
      release_tag:
        description: pc-release için mevcut taslağın etiketi (ör. v1.1 veya v2.0)
        type: string
        default: ""
      release_id:
        description: pc-release için mevcut taslağın sayısal GitHub kimliği
        type: string
        default: ""
      release_audit_only:
        description: pc-release taslağını yalnız yeniden indir/doğrula; yükleme/değiştirme yok
        type: boolean
        default: false
      architecture:
        description: Yalnızca Raspberry Pi hedefi için
        type: choice
        options: [both, armhf, arm64]
        default: both
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PC doğrulaması, ayrı hedefte süren bir imaj işini bekletmez veya iptal etmez.
  group: oguzdows-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target || 'pc' }}
  # Yeni bir çalıştırma, süren ISO işini yarıda kesmesin.
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.inputs.target != 'raspberrypi' && github.event.inputs.target != 'pc-diagnostics' && github.event.inputs.target != 'pc-release'
    name: Yapılandırma ve GTK · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    container:
      image: debian:${{ matrix.suite }}
    env:
      GSETTINGS_BACKEND: memory
      NO_AT_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Doğrulama araçları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-yaml python3-pil \
            python3-gi gir1.2-gtk-3.0 shellcheck fonts-inter fonts-noto-core \
            fonts-dejavu-core adwaita-icon-theme xauth xvfb dbus-x11 pciutils usbutils rfkill \
            gsettings-desktop-schemas dconf-gsettings-backend xdg-desktop-portal xdg-desktop-portal-gtk gir1.2-gtk-4.0 gir1.2-adw-1 \
            calamares thunar xfce4-terminal xfce4-screenshooter x11-utils xfconf xfwm4 picom xfce4-panel xfce4-settings xfce4-whiskermenu-plugin \
            xfce4-pulseaudio-plugin xfce4-power-manager xfce4-power-manager-plugins libxcursor1 python3-apt python3-xlib \
            gpgv ca-certificates flatpak gnome-software gnome-software-plugin-flatpak libglib2.0-bin \
            librsvg2-common shared-mime-info iso-codes gdb \
            build-essential pkg-config libgtk-3-dev libjson-glib-dev libxfce4ui-2-dev libxfce4panel-2.0-dev libxfconf-0-dev libwnck-3-dev gir1.2-flatpak-1.0 \
            initramfs-tools-core cpio gzip xz-utils

      - name: Yerel görev çubuğu / Dock ve otomatik renk izleyicisini derle
        run: |
          python3 scripts/ci-run.py --title 'Native Xfce module and observer ABI' -- sh scripts/build-panel.sh /
          cp system/usr/share/xfce4/panel/plugins/oguzdows-tasks.desktop /usr/share/xfce4/panel/plugins/
          mkdir -p /usr/lib/oguzdows
          cp system/usr/lib/oguzdows/*.py /usr/lib/oguzdows/
          cp scripts/render-assets.py /usr/lib/oguzdows/render-assets.py

      - name: Mağaza varsayılanlarını gerçek şemalarla derle
        run: |
          cp system/usr/share/glib-2.0/schemas/*.override /usr/share/glib-2.0/schemas/
          glib-compile-schemas --strict /usr/share/glib-2.0/schemas
          test "$(gsettings get org.gnome.software download-updates)" = false
          test "$(gsettings get org.gnome.software download-updates-notify)" = false
          test "$(gsettings get org.gnome.desktop.interface cursor-theme)" = "'OguzDowsTespih'"

      - name: Birim ve yapılandırma testleri
        run: |
          python3 scripts/ci-run.py --title 'Birim ve yapılandırma testleri' -- \
            python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Kabuk betiklerini denetle
        run: |
          shellcheck build.sh hooks/* pc/initramfs-tools/hooks/* system/usr/lib/oguzdows/*.sh \
            system/usr/local/bin/* system/usr/local/sbin/oguzdows-installer

      - name: Gerçek GTK arayüzünü aç ve doğrula
        run: |
          cp -a system/usr/share/themes/. /usr/share/themes/
          python3 scripts/ci-run.py --title 'Tema görselleri' -- \
            python3 scripts/render-assets.py --root /
          gtk-update-icon-cache -f -t /usr/share/icons/hicolor
          cp system/usr/share/oguzdows/picom.conf /usr/share/oguzdows/picom.conf
          cp -a system/usr/share/oguzdows/compositor /usr/share/oguzdows/
          python3 scripts/ci-run.py --title 'GTK arayüz kontrolü' -- \
            xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
            python3 tests/smoke-welcome.py --output test-results
          python3 scripts/ci-run.py --title 'Canlı karşılayıcı GTK kontrolü' -- \
            xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
            python3 tests/smoke-welcome.py --live --output test-results/live

      - name: Yerel C mağazasını derle ve gerçek GTK ile aç
        run: |
          sh scripts/build-native.sh /tmp/oguzdows-store-native
          sh scripts/build-native.sh /tmp/oguzdows-store-ui-test --test
          python3 scripts/ci-run.py --title 'Derlenen yerel mağaza' -- \
            xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- \
            /tmp/oguzdows-store-ui-test --smoke-test test-results/native-store
          python3 scripts/ci-run.py --title 'C Store GTK 360x800 (fixture only)' -- \
            xvfb-run -a -s '-screen 0 360x800x24' dbus-run-session -- \
            /tmp/oguzdows-store-ui-test --smoke-test test-results/store-360x800

      - name: Yerel hafif haber okuyucusu ve kısa ömürlü RSS işçisi (ağsız fixture)
        if: ${{ !cancelled() }}
        run: |
          sh scripts/build-news.sh /tmp/oguzdows-news-native
          sh scripts/build-news.sh /tmp/oguzdows-news-ui-test --test
          /tmp/oguzdows-news-native --version
          for screen in 1024x768 360x800; do
            python3 scripts/ci-run.py --title "C Haber GTK $screen (ağsız fixture)" -- \
              xvfb-run -a -s "-screen 0 ${screen}x24" dbus-run-session -- \
              /tmp/oguzdows-news-ui-test --smoke-test "test-results/news-$screen"
          done

      - name: Ortak native materyal, canlı tercih olayı ve sınırlı GTK geçişi
        run: |
          python3 scripts/ci-run.py --title 'Native material · GTK CSS / transition / reduced motion' -- \
            xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
            python3 tests/smoke-material.py --output test-results/material
          python3 scripts/ci-run.py --title 'Explicit live RSS health (offline is reported honestly)' -- \
            python3 tests/smoke-news-live.py --output test-results/news-live.json

      - name: Gerçek mağaza yükle/kaldır · yalnız tek kullanımlık amd64/trixie container
        if: matrix.suite == 'trixie'
        run: |
          python3 scripts/ci-run.py --title 'Real guarded Store package transaction (disposable container only)' -- \
            python3 tests/smoke-store-transaction.py --disposable-container --output test-results/store-transaction

      - name: Tek kompozitör, kısa geçiş ve düşük RAM koruması (özel normal kullanıcı)
        run: |
          python3 scripts/ci-run.py --title 'Gerçek Picom / Xfwm sahipliği' -- \
            xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' -- \
            python3 tests/smoke-effects.py --output test-results/effects

      - name: Gerçek kullanıcıda uygulama başlatma ve kısa ömürlü işçi (paket fixture)
        run: |
          python3 scripts/ci-run.py --title 'Gio kullanıcı başlatma ve JSON boru ayrımı' -- \
            python3 tests/smoke-store-launch.py --output test-results/store-launch

      - name: EXE / APK onay arayüzü ve deneysel telefon karşılayıcısı
        run: |
          for component in compatibility devices; do
            python3 scripts/ci-run.py --title "Uyumluluk GTK $component" -- \
              xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
              python3 tests/smoke-compatibility.py --component "$component" --output test-results
          done
          for component in compatibility devices; do
            python3 scripts/ci-run.py --title "360px telefon $component (host)" -- \
              xvfb-run -a -s '-screen 0 360x800x24' dbus-run-session -- \
              python3 tests/smoke-compatibility.py --phone --component "$component" --output "test-results/phone-$component"
          done
          python3 scripts/ci-run.py --title 'Dar telefon karşılayıcısı (host)' -- \
            xvfb-run -a -s '-screen 0 480x900x24' dbus-run-session -- \
            python3 tests/smoke-welcome.py --phone --output test-results/phone
          python3 scripts/ci-run.py --title '360px telefon karşılayıcısı (host)' -- \
            xvfb-run -a -s '-screen 0 360x800x24' dbus-run-session -- \
            python3 tests/smoke-welcome.py --phone --output test-results/phone-narrow
          python3 scripts/ci-run.py --title 'Dar C mağaza (host)' -- \
            xvfb-run -a -s '-screen 0 480x900x24' dbus-run-session -- \
            /tmp/oguzdows-store-ui-test --smoke-test test-results/phone-store
          python3 scripts/ci-run.py --title '360px C mağaza (host)' -- \
            xvfb-run -a -s '-screen 0 360x800x24' dbus-run-session -- \
            /tmp/oguzdows-store-ui-test --smoke-test test-results/phone-store-narrow
          for device in arm64-uefi pinephone pinephone-pro rockpro64; do
            python3 scripts/configure-arm.py --device "$device" --output "/tmp/oguzdows-$device"
          done

      - name: Güncelleyici, onay akışı, altı gerçek xfconf düzeni ve İmece
        run: |
          for component in updater culture store; do
            python3 scripts/ci-run.py --title "Bakım GTK $component" -- \
              xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
              python3 tests/smoke-maintenance-ui.py --component "$component" --output test-results
          done

      - name: Hafif başlangıç ve gerçek oturum seçicisi (host, paketler taklit)
        run: |
          for component in light desktops; do
            python3 scripts/ci-run.py --title "Oturum GTK $component" -- \
              xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
              python3 tests/smoke-session-ui.py --component "$component" --output test-results
          done

      - name: Açık GTK3 / libadwaita uygulamalarında koyu-açık senkronu, gerçek Print ve Başlat
        if: ${{ !cancelled() }}
        run: |
          install -m755 system/usr/local/bin/oguzdows-screenshot /usr/local/bin/oguzdows-screenshot
          install -Dm644 system/etc/xdg/xdg-desktop-portal/xfce-portals.conf /etc/xdg/xdg-desktop-portal/xfce-portals.conf
          sh scripts/build-desktop.sh hub /tmp/oguzdows-hub-polish
          install -m755 /tmp/oguzdows-hub-polish /usr/lib/oguzdows/oguzdows-hub-native
          install -m755 system/usr/local/bin/oguzdows-hub /usr/local/bin/oguzdows-hub
          install -m755 system/usr/local/bin/oguzdows-desktop /usr/local/bin/oguzdows-desktop
          cp system/usr/share/applications/oguzdows-hub.desktop system/usr/share/applications/oguzdows-desktop.desktop /usr/share/applications/
          python3 scripts/ci-run.py --title 'Real application themes / PrintScreen / Start' -- \
            xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            python3 tests/smoke-desktop-polish.py --hub /tmp/oguzdows-hub-polish --output test-results/desktop-polish

      - name: Duvar kâğıdı olayı → native izleyici → GTK / Xfwm / gerçek Thunar
        run: |
          python3 scripts/ci-run.py --title 'Real native wallpaper accent / manual stop / Thunar' -- \
            xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            python3 tests/smoke-accent.py --output test-results/accent

      - name: Gerçek Xfce üst çubuk ve iskele geometrisi (özel host oturumu)
        run: |
          for app in browser files store terminal; do
            cp "system/usr/share/applications/oguzdows-$app.desktop" /usr/share/applications/
          done
          # Real packaged launchers, never invoked by this geometry test.
          cp system/usr/local/bin/oguzdows-browser system/usr/local/bin/oguzdows-store /usr/local/bin/
          for screen in 1024x768 1280x900 1920x1080; do
            python3 scripts/ci-run.py --title "Altı gerçek Xfce panel düzeni $screen" -- \
              xvfb-run -a -s "-screen 0 ${screen}x24 -nolisten tcp" dbus-run-session -- \
              python3 tests/smoke-profiles.py --output "test-results/profiles-$screen"
          done

      - name: Gerçek mağaza küçültme, açık tam çıkış ve D-Bus süreç ömrü
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci-run.py --title 'Mağaza güvenli tam çıkış' -- \
            xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- \
            python3 tests/smoke-store.py --output test-results

      - name: Paket kurmadan gerçek APT planları ve isteğe bağlı güncel Pardus imzası
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci-run.py --title 'Bakım aday ve imza kontrolü' -- \
            python3 tests/smoke-maintenance.py --suite '${{ matrix.suite }}' --output test-results

      - name: Hafif başlatıcı, boşta yük ve kurulumda Rıfkı duraklatma
        run: |
          for component in welcome rifki installer coordination; do
            python3 scripts/ci-run.py --title "Hafif arayüz $component" -- \
              xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
              python3 tests/smoke-lightweight.py --component "$component" --output test-results
          done

      - name: Doğal panel kayıtları ve kurulum D-Bus ses kapısı
        run: |
          python3 scripts/ci-run.py --title 'Doğal kayıt GTK ve D-Bus' -- \
            xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
            python3 tests/smoke-narration.py --output test-results
          python3 scripts/ci-run.py --title '360px anlatım GTK ve D-Bus (host)' -- \
            xvfb-run -a -s '-screen 0 360x800x24' dbus-run-session -- \
            python3 tests/smoke-narration.py --phone --output test-results/phone-narration

      - name: Gerçek kurucuyu disk işlemi yapmadan aç
        run: |
          python3 scripts/configure.py --arch '${{ matrix.suite == 'trixie' && 'amd64' || 'i386' }}' --output /tmp/oguzdows-smoke
          cp -a /tmp/oguzdows-smoke/includes.chroot/etc/calamares /etc/
          cp -a /tmp/oguzdows-smoke/includes.chroot/usr/share/calamares/branding/oguzdows /usr/share/calamares/branding/
          python3 scripts/ci-run.py --title 'Canlı kurucu açılış kontrolü' -- \
            xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
            python3 tests/smoke-installer.py --config /etc/calamares --output test-results

      - name: Mağaza · masaüstü görsel önizleme
        if: ${{ !cancelled() && matrix.suite == 'trixie' }}
        run: python3 scripts/ci-preview.py test-results/native-store/store-native.png

      - name: Mağaza · kompakt görsel önizleme
        if: ${{ !cancelled() && matrix.suite == 'bookworm' }}
        run: python3 scripts/ci-preview.py test-results/native-store/store-native-compact.png

      - name: Haber · küçültülmüş okuyucu görsel önizleme
        if: ${{ !cancelled() && matrix.suite == 'bookworm' }}
        run: python3 scripts/ci-preview.py test-results/news-1024x768/news-compact.png

      - name: Thunar · koyu görsel önizleme
        if: ${{ !cancelled() && matrix.suite == 'trixie' }}
        run: python3 scripts/ci-preview.py test-results/desktop-polish/thunar-dark.png

      - name: Arayüz ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OguzDows-arayuz-${{ matrix.suite }}
          path: |
            test-results/**/*.png
            test-results/**/previews/*.webp
            test-results/**/*.log
            test-results/**/*.json
          if-no-files-found: warn
          retention-days: 7

  installed-boot:
    name: Firmware → GRUB · ${{ matrix.suite }}
    if: github.event.inputs.target != 'raspberrypi' && github.event.inputs.target != 'pc-diagnostics' && github.event.inputs.target != 'pc-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    container:
      image: debian:${{ matrix.suite }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Yalnızca geçici disk imajları için boot test araçları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-yaml calamares grub-pc-bin grub-efi-amd64-bin \
            grub2-common parted e2fsprogs dosfstools qemu-system-x86 seabios ovmf \
            udev util-linux mount
          # GRUB 2.06, loop bölümünün sysfs yolunu udevadm info ile bulur.
      - name: Gerçek Calamares mount ve chroot GRUB aygıt keşfi
        run: |
          python3 scripts/ci-run.py --title 'Calamares mount ${{ matrix.suite }}' -- \
            python3 tests/smoke-calamares-mount.py --output test-results/calamares-mount
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OguzDows-Calamares-mount-${{ matrix.suite }}
          path: test-results/calamares-mount
          if-no-files-found: warn
          retention-days: 7
      - name: Gerçek GRUB ile BIOS ve NVRAM'siz UEFI fallback açılışı
        run: |
          python3 scripts/ci-run.py --title 'Kurulu disk boot ${{ matrix.suite }}' -- \
            python3 tests/smoke-installed-boot.py --output test-results/installed-boot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OguzDows-kurulu-boot-${{ matrix.suite }}
          path: test-results/installed-boot
          if-no-files-found: warn
          retention-days: 7

  build:
    name: ISO · ${{ matrix.arch }}
    needs: [verify, installed-boot]
    if: github.event_name != 'pull_request' && github.event.inputs.target != 'raspberrypi' && github.event.inputs.target != 'pc-tests' && github.event.inputs.target != 'pc-diagnostics' && github.event.inputs.target != 'pc-release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            suite: trixie
          - arch: i386
            suite: bookworm
    container:
      image: debian:${{ matrix.suite }}
      options: --privileged
    steps:
      - name: Kaynak kimliği için Git (checkout öncesi)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Derleme araçları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools \
            xorriso syslinux syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools python3 python3-yaml ca-certificates \
            qemu-system-x86 seabios ovmf udev util-linux mount parted e2fsprogs \
            initramfs-tools-core

      - name: ISO derle ve önyükleme dosyalarını doğrula
        run: python3 scripts/ci-run.py --title 'ISO ${{ matrix.arch }}' -- bash build.sh ${{ matrix.arch }}

      - name: ISO içeriğinden hedef disk, gerçek çekirdek ve systemd açılışı
        run: |
          python3 scripts/ci-run.py --title 'ISO hedef OS ${{ matrix.arch }}' -- \
            python3 tests/smoke-iso-target.py --iso 'OguzDows-${{ matrix.arch }}.iso' \
            --arch '${{ matrix.arch }}' --expected-revision "$GITHUB_SHA" --graphical-idle --low-ram-checks \
            --output 'test-results/iso-target-${{ matrix.arch }}'

      - name: Hedef sistem açılış kanıtları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OguzDows-ISO-hedef-test-${{ matrix.arch }}
          path: test-results/iso-target-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 7

      - name: ISO ve SHA-256 dosyaları
        uses: actions/upload-artifact@v4
        with:
          name: OguzDows-${{ matrix.arch }}
          path: |
            OguzDows-${{ matrix.arch }}.iso
            OguzDows-${{ matrix.arch }}.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Başarısız derleme günlüğü
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OguzDows-derleme-gunlugu-${{ matrix.arch }}
          path: build-${{ matrix.arch }}/build.log
          if-no-files-found: ignore
          retention-days: 7

  diagnostics:
    name: Önceki hedef sistem testinin kanıtları (derleme yapmaz)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pc-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Tamamlanan çalışmanın küçük hedef test raporlarını al
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run }}
          pattern: OguzDows-ISO-hedef-test-*
          path: target-evidence
      - name: Gerçek hata ve kaynak kimliğini kontrol notuna yaz
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          reports = sorted(Path('target-evidence').rglob('target-os-result.json'))
          if not reports:
              raise SystemExit('İstenen çalışmada hedef sistem test raporu bulunamadı.')
          for path in reports:
              data = json.loads(path.read_text())
              selected = {k: data.get(k) for k in ('arch', 'source_revision', 'build', 'modes', 'initramfs', 'desktop_idle', 'low_ram')}
              selected['error_tail'] = str(data.get('error', ''))[-1400:]
              selected['report_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
              text = json.dumps(selected, ensure_ascii=False, separators=(',', ':'))
              if len(text) > 3500:
                  raise SystemExit('Hedef kanıtı kontrol notu sınırını aştı; kesilmiş JSON yayımlanmadı.')
              print('::notice title=Önceki hedef sistem kanıtı::' + text.replace('%', '%25'))
          for path in sorted(Path('target-evidence').rglob('*.serial.log')):
              lines = [line for line in path.read_text(errors='replace').splitlines()
                  if any(term in line for term in ('Memory:', 'RAMDISK:', 'unpack rootfs',
                      'Freeing initrd memory', 'Kernel panic - not syncing', 'Out of memory and no killable processes'))]
              selected = {'log': str(path.relative_to('target-evidence')), 'boot_memory_lines': lines[:12]}
              text = json.dumps(selected, ensure_ascii=False, separators=(',', ':'))
              if len(text) > 3500:
                  raise SystemExit('UART bellek kanıtı kontrol notu sınırını aştı.')
              # Two target + six RAM notices fit the ten-notice step budget.
              # UART details remain in the logs and original evidence artifact.
              print('Önceki erken açılış belleği: ' + text)
          for path in sorted([*Path('target-evidence').rglob('desktop-idle.json'), *Path('target-evidence').rglob('low-ram-idle.json')]):
              data = json.loads(path.read_text())
              selected = {k: data.get(k) for k in ('build', 'method', 'vm_ram_mib', 'target_bytes', 'settled_seconds',
                  'sample_count', 'sample_interval_seconds', 'idle_confirmed_by_operator',
                  'valid_idle_measurement', 'invalid_reasons', 'median_used_bytes', 'max_used_bytes',
                  'median_used_mb', 'max_used_mb', 'busy_cpu_percent', 'target_met')}
              selected['report_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
              samples = data.get('samples', [])
              selected['samples'] = [{k: item.get(k) for k in ('used_bytes', 'graphical_xfce',
                  'desktop_user', 'desktop_processes', 'known_foreground_or_package_work',
                  'cpu_total_ticks', 'cpu_idle_ticks')} for item in samples]
              selected['zram'] = samples[-1].get('zram', []) if samples else []
              text = json.dumps(selected, ensure_ascii=False, separators=(',', ':'))
              if len(text) > 3500:
                  raise SystemExit('RAM kanıtı kontrol notu sınırını aştı; kesilmiş JSON yayımlanmadı.')
              print('::notice title=Önceki tam Xfce RAM örnekleri::' + text.replace('%', '%25'))
          PY

  release:
    name: Doğrulanmış PC / Pi imajları → Release taslağı (derlemez)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pc-release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    concurrency:
      group: oguzdows-release-${{ github.repository }}-${{ inputs.release_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Salt okunur imaj inceleme araçları (imajdan kod çalıştırılmaz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml xorriso squashfs-tools xz-utils fdisk e2fsprogs udev
      - name: Yayın aracı negatif / bütünlük regresyonları
        run: |
          python3 scripts/ci-run.py --title 'Yayın aracı regresyonu' -- \
            python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_release*.py' -v
      - name: Kaynak, SHA-256 ve boot/RAM kanıtlarıyla taslağa aktar
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run }}
          PI_SOURCE_RUN: ${{ inputs.pi_evidence_run }}
          AUDIT_ONLY: ${{ inputs.release_audit_only }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          extra=()
          if [ -n "$PI_SOURCE_RUN" ]; then extra=(--pi-run "$PI_SOURCE_RUN"); fi
          if [ "$AUDIT_ONLY" = true ]; then extra+=(--audit); fi
          python3 scripts/ci-run.py --title 'Release imaj aktarımı / denetimi' -- \
            python3 scripts/release-assets.py --run "$SOURCE_RUN" --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" "${extra[@]}"

  raspberrypi:
    name: Raspberry Pi
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'raspberrypi'
    uses: ./.github/workflows/raspberrypi.yml
    with:
      architecture: ${{ inputs.architecture || 'both' }}
