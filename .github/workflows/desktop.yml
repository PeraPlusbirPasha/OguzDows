name: OğuzDows Yerel Masaüstü

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'system/**'
      - 'scripts/**'
      - 'packages/**'
      - 'hooks/**'
      - 'raspberrypi/**'
      - 'tests/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: oguzdows-native-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Yerel C · GTK · ayar API'leri · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    container:
      image: debian:${{ matrix.suite }}
    env:
      NO_AT_BRIDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hedef tabanın gerçek GTK / GSettings / KConfig araçları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libjson-glib-dev libxfce4ui-2-dev libxfce4panel-2.0-dev libxfconf-0-dev libwnck-3-dev \
            python3 python3-gi python3-gi-cairo python3-pil python3-yaml python3-pyflakes python3-cairo \
            gir1.2-gtk-3.0 libglib2.0-bin gsettings-desktop-schemas gnome-shell-common \
            breeze xauth xvfb dbus-x11 fonts-dejavu-core librsvg2-common adwaita-icon-theme \
            shared-mime-info desktop-file-utils shellcheck nodejs \
            xfconf xfwm4 picom mesa-utils libgl1-mesa-dri x11-xserver-utils
          case '${{ matrix.suite }}' in
            bookworm) apt-get install -y --no-install-recommends libkf5config-bin ;;
            trixie) apt-get install -y --no-install-recommends libkf6config-bin ;;
          esac
      - name: Yerel panel bileşeni ve olay tabanlı izleyici ABI'si
        run: |
          python3 scripts/ci-run.py --title 'Native Xfce module and observer ABI' -- sh scripts/build-panel.sh /
          mkdir -p /usr/lib/oguzdows
          cp system/usr/lib/oguzdows/*.py /usr/lib/oguzdows/
          cp scripts/render-assets.py /usr/lib/oguzdows/render-assets.py

      - name: Kaynak, JSON / şema ve ABI yükleyicileri
        run: |
          python3 -m pyflakes system/usr/lib/oguzdows/desktop_*.py \
            system/usr/lib/oguzdows/aero.py tests/test_desktop_*.py tests/smoke-desktop.py tests/smoke-aero.py \
            scripts/install-desktop-assets.py system/usr/lib/oguzdows/workbench*.py \
            tests/test_workbench.py tests/test_store_bootstrap.py tests/smoke-workbench.py
          python3 scripts/ci-run.py --title 'Yerel masaüstü birim testleri' -- \
            python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_desktop_*.py' -v
          shellcheck scripts/build-desktop.sh scripts/test-native-files.sh scripts/smoke-portable.sh system/usr/lib/oguzdows/session.sh
          sh scripts/test-native-files.sh
          node --check system/usr/share/oguzdows/gnome/core.js
          node --check system/usr/share/kwin/effects/oguzdows-aero/contents/code/main.js
          node --check system/usr/share/oguzdows/kwin/snap.js
          cp system/usr/share/glib-2.0/schemas/org.oguzdows.desktop.gschema.xml /usr/share/glib-2.0/schemas/
          glib-compile-schemas --strict /usr/share/glib-2.0/schemas
          for component in desktop hub monitor workbench software; do
            desktop-file-validate "system/usr/share/applications/oguzdows-$component.desktop"
          done
      - name: Yerel hedef ABI'sinde derle; mock C / HTML yok
        shell: bash
        run: |
          mkdir -p test-results/bin
          result=0
          for component in monitor hub; do
            python3 scripts/ci-run.py --title "C $component · ${{ matrix.suite }}" -- \
              sh scripts/build-desktop.sh "$component" "test-results/bin/$component" || result=1
            python3 scripts/ci-run.py --title "C $component test · ${{ matrix.suite }}" -- \
              sh scripts/build-desktop.sh "$component" "test-results/bin/$component-test" --test || result=1
            if test -x "test-results/bin/$component"; then "test-results/bin/$component" --version; fi
          done
          exit "$result"
      - name: Çevrimdışı görseller ve gerçek GTK (özel normal kullanıcı, fiziksel GPU değil)
        shell: bash
        run: |
          cp -a system/usr/share/themes/. /usr/share/themes/
          python3 scripts/ci-run.py --title 'Yerel cam materyalleri' -- python3 scripts/render-assets.py --root /
          # Pinned defaults must refer to real installed launchers, not absent
          # Exec paths which GIO correctly omits from its application list.
          cp system/usr/local/bin/oguzdows-{desktop,hub,monitor,workbench} /usr/local/bin/
          install -m755 test-results/bin/hub /usr/lib/oguzdows/oguzdows-hub-native
          install -m755 test-results/bin/monitor /usr/lib/oguzdows/oguzdows-monitor-native
          cp system/usr/share/applications/oguzdows-{desktop,hub,monitor,workbench}.desktop /usr/share/applications/
          gtk-update-icon-cache -f -t /usr/share/icons/hicolor
          result=0
          for spec in '1024x768 light' '360x800 dark'; do
            read -r screen appearance <<< "$spec"
            python3 scripts/ci-run.py --title "Yerel GTK ve ayar API $screen · ${{ matrix.suite }}" -- \
              xvfb-run -a -s "-screen 0 ${screen}x24 -nolisten tcp" \
              python3 tests/smoke-desktop.py --binaries test-results/bin \
              --appearance "$appearance" --output "test-results/desktop-$screen" || result=1
          done
          exit "$result"
      - name: Gerçek Picom parser / GLX shader / ARGB arkaplan blur (yazılım GPU'su)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /usr/share/oguzdows
          cp -a system/usr/share/oguzdows/compositor /usr/share/oguzdows/
          python3 scripts/ci-run.py --title 'Picom GLX gerçek blur · ${{ matrix.suite }}' -- \
            xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp +extension GLX +extension COMPOSITE' \
            python3 tests/smoke-aero.py --output test-results/desktop-aero
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-${{ matrix.suite }}
          path: |
            test-results/desktop-*/
          if-no-files-found: warn
          retention-days: 14

  shells:
    name: Gerçek kabuk · ${{ matrix.desktop }} · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        desktop: [gnome, kde]
    container:
      image: debian:${{ matrix.suite }}
    env:
      NO_AT_BRIDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Yalnız özel container'a gerçek kabuk / Mesa / ayar araçları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-gi python3-pil python3-gi-cairo \
            gir1.2-gtk-3.0 libglib2.0-bin gsettings-desktop-schemas dconf-gsettings-backend \
            xauth xvfb dbus-x11 fonts-dejavu-core adwaita-icon-theme librsvg2-common \
            mesa-utils libgl1-mesa-dri x11-xserver-utils
          case '${{ matrix.desktop }}:${{ matrix.suite }}' in
            gnome:*) apt-get install -y --no-install-recommends gnome-shell ;;
            kde:bookworm) apt-get install -y --no-install-recommends plasma-desktop plasma-workspace kwin-x11 kwin-common breeze plasma-integration libkf5config-bin libkf5globalaccel-bin python3-pyqt5 ;;
            kde:trixie) apt-get install -y --no-install-recommends plasma-desktop plasma-workspace kwin-x11 kwin-common breeze plasma-integration libkf6config-bin kglobalacceld python3-pyqt6 ;;
          esac
      - name: Yerel kaynakları yerleştir (üretim hesabı / imaj / Release yok)
        run: |
          mkdir -p /usr/share/oguzdows /usr/share/kwin/effects
          cp -a system/usr/share/oguzdows/gnome system/usr/share/oguzdows/kwin /usr/share/oguzdows/
          cp -a system/usr/share/kwin/effects/oguzdows-aero /usr/share/kwin/effects/
          cp -a system/usr/share/themes/. /usr/share/themes/
          cp system/usr/share/glib-2.0/schemas/org.oguzdows.desktop.gschema.xml /usr/share/glib-2.0/schemas/
          glib-compile-schemas --strict /usr/share/glib-2.0/schemas
          python3 scripts/install-desktop-assets.py --root / --suite '${{ matrix.suite }}'
          python3 scripts/render-assets.py --root /
      - name: Uzantı / KWin scripted effect / Aurorae / canlı Qt paleti / Snap / geri alma
        run: |
          python3 scripts/ci-run.py --title 'Gerçek ${{ matrix.desktop }} · ${{ matrix.suite }}' -- \
            xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp +extension GLX +extension COMPOSITE' \
            python3 tests/smoke-shells.py --desktop '${{ matrix.desktop }}' --output test-results/shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-shell-${{ matrix.desktop }}-${{ matrix.suite }}
          path: test-results/shell/
          if-no-files-found: warn
          retention-days: 14
